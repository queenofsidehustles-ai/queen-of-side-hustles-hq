{% extends "base_admin.html" %}
{% block page_title %}Genesis AI{% endblock %}
{% block page_subtitle %}{% endblock %}

{% block content %}
<style>
    .genesis-orb {
        width: 110px; height: 110px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #d4a0ff, #9b59f7, #6b21d6);
        box-shadow: 0 0 60px rgba(155,89,247,0.45), 0 0 120px rgba(155,89,247,0.2);
        animation: orbPulse 3s ease-in-out infinite;
        margin: 0 auto;
        cursor: pointer;
    }
    .genesis-orb.loading {
        animation: orbPulseFast 0.9s ease-in-out infinite;
    }
    @keyframes orbPulse {
        0%,100% { transform:scale(1);   box-shadow:0 0 60px rgba(155,89,247,0.45); }
        50%      { transform:scale(1.06); box-shadow:0 0 90px rgba(155,89,247,0.7); }
    }
    @keyframes orbPulseFast {
        0%,100% { transform:scale(1);   box-shadow:0 0 60px rgba(155,89,247,0.55); }
        50%      { transform:scale(1.09); box-shadow:0 0 110px rgba(155,89,247,0.9); }
    }
    .genesis-orb-section {
        display:flex; flex-direction:column; align-items:center;
        justify-content:center; padding:28px 16px 16px; gap:12px; flex-shrink:0;
    }
    .genesis-orb-label {
        font-size:0.78rem; letter-spacing:0.12em; text-transform:uppercase;
        color:#a78bfa; opacity:0.85;
    }
    .genesis-controls { display:flex; gap:10px; margin-top:4px; }
    .genesis-controls button {
        background:transparent; border:1px solid var(--border); color:var(--text-subtle);
        padding:5px 14px; border-radius:6px; font-size:0.75rem; cursor:pointer;
        transition:all 0.2s; text-transform:uppercase; letter-spacing:0.06em;
    }
    .genesis-controls button:hover { border-color:#8b5cf6; color:#a78bfa; }

    /* Quick prompts */
    .genesis-quick-bar {
        display:flex; gap:7px; flex-wrap:wrap; padding:10px 20px 12px;
        border-bottom:1px solid var(--border); flex-shrink:0;
        justify-content:center;
    }
    .genesis-quick-btn {
        padding:6px 13px; border-radius:20px; border:1px solid rgba(139,92,246,0.35);
        background:rgba(139,92,246,0.08); color:#c4b5fd; font-size:0.75rem;
        font-weight:600; cursor:pointer; transition:all 0.15s; white-space:nowrap;
    }
    .genesis-quick-btn:hover { background:rgba(139,92,246,0.2); border-color:#8b5cf6; color:#e9d5ff; }

    .genesis-conversation-label {
        font-size:0.65rem; letter-spacing:0.14em; text-transform:uppercase;
        color:var(--text-subtle); padding:10px 24px 6px; border-top:1px solid var(--border); flex-shrink:0;
    }
    .genesis-messages {
        flex:1; overflow-y:auto; padding:8px 24px 16px;
        display:flex; flex-direction:column; gap:14px;
    }
    .genesis-msg { display:flex; align-items:flex-start; gap:10px; max-width:82%; }
    .genesis-msg.ai   { align-self:flex-start; }
    .genesis-msg.user { align-self:flex-end; flex-direction:row-reverse; }
    .genesis-avatar {
        width:28px; height:28px; border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        font-size:0.6rem; font-weight:700; letter-spacing:0.04em; flex-shrink:0; margin-top:2px;
    }
    .genesis-avatar.ai-avatar   { background:linear-gradient(135deg,#8b5cf6,#6d28d9); color:#fff; }
    .genesis-avatar.user-avatar { background:rgba(139,92,246,0.15); color:#a78bfa; border:1px solid rgba(139,92,246,0.3); }
    .genesis-bubble {
        padding:10px 16px; border-radius:14px;
        font-size:0.875rem; line-height:1.65; color:var(--text-primary);
    }
    .genesis-msg.ai   .genesis-bubble { background:var(--bg-card); border:1px solid var(--border-light); border-radius:14px 14px 14px 4px; }
    .genesis-msg.user .genesis-bubble { background:rgba(139,92,246,0.12); border:1px solid rgba(139,92,246,0.25); border-radius:14px 14px 4px 14px; }
    .genesis-bubble .timestamp { font-size:0.6rem; color:var(--text-subtle); margin-top:4px; }

    .genesis-typing-dots { display:flex; gap:5px; align-items:center; }
    .genesis-typing-dots span {
        width:7px; height:7px; border-radius:50%;
        background:#8b5cf6; animation:typingBounce 1.4s infinite both;
    }
    .genesis-typing-dots span:nth-child(2) { animation-delay:0.2s; }
    .genesis-typing-dots span:nth-child(3) { animation-delay:0.4s; }
    @keyframes typingBounce {
        0%,80%,100% { transform:translateY(0); opacity:0.4; }
        40% { transform:translateY(-6px); opacity:1; }
    }

    .genesis-input-bar {
        padding:14px 24px; border-top:1px solid var(--border);
        background:var(--bg-card); flex-shrink:0;
    }
    .genesis-input-bar form { display:flex; gap:10px; align-items:center; }
    .genesis-input-bar input {
        flex:1; background:var(--bg-input); border:1px solid var(--border);
        border-radius:10px; padding:11px 16px; color:var(--text-primary);
        font-size:0.9rem; outline:none; transition:border-color 0.2s;
    }
    .genesis-input-bar input:focus { border-color:#8b5cf6; }
    .genesis-input-bar button[type="submit"] {
        background:linear-gradient(135deg,#8b5cf6,#6d28d9);
        border:none; border-radius:10px; width:42px; height:42px;
        display:flex; align-items:center; justify-content:center;
        cursor:pointer; transition:opacity 0.2s; flex-shrink:0;
    }
    .genesis-input-bar button[type="submit"]:disabled { opacity:0.4; cursor:not-allowed; }
    .genesis-mic-btn {
        background:transparent; border:1px solid var(--border); border-radius:10px;
        width:42px; height:42px; display:flex; align-items:center; justify-content:center;
        cursor:pointer; transition:all 0.2s; flex-shrink:0; color:var(--text-subtle);
    }
    .genesis-mic-btn.active {
        background:rgba(239,68,68,0.12); border-color:rgba(239,68,68,0.5); color:#ef4444;
        animation:micPulse 1.2s ease-in-out infinite;
    }
    @keyframes micPulse {
        0%,100% { box-shadow:0 0 0 0 rgba(239,68,68,0.3); }
        50%      { box-shadow:0 0 0 6px rgba(239,68,68,0); }
    }
    .genesis-bubble p { margin:0 0 8px; }
    .genesis-bubble p:last-child { margin-bottom:0; }
    .genesis-bubble ul,.genesis-bubble ol { padding-left:18px; margin:6px 0; }
    .genesis-bubble li { margin-bottom:4px; }
    .genesis-bubble strong { color:var(--text-primary); }
</style>

<div x-data="genesisChat()" x-init="init()" style="
    display:flex; flex-direction:column;
    height:calc(100vh - 140px);
    max-width:900px; margin:0 auto;
    border-radius:12px; overflow:hidden;
    background:var(--bg-secondary); border:1px solid var(--border);
">
    <!-- ORB SECTION -->
    <div class="genesis-orb-section">
        <div class="genesis-orb" :class="{ 'loading': loading }"></div>
        <span class="genesis-orb-label"
              x-text="loading ? 'thinking...' : listening ? 'hearing you...' : (messages.length === 0 ? 'ready when you are' : 'ready')"></span>
        <div class="genesis-controls">
            <button type="button" @click="clearHistory()">Clear</button>
        </div>
    </div>

    <!-- QUICK PROMPTS -->
    <div class="genesis-quick-bar">
        <button class="genesis-quick-btn" @click="quickSend('Write me a 60-second face-cam live script for KPPS. Hook the tired working mom who keeps doing parties for free.')">🎥 Live Script</button>
        <button class="genesis-quick-btn" @click="quickSend('Draft a warm follow-up email for a new lead who just downloaded my checklist but hasn\'t bought KPPS yet.')">✉️ Follow-up Email</button>
        <button class="genesis-quick-btn" @click="quickSend('Give me a TikTok caption for a face-cam video about starting a kids party business with no experience.')">📱 Post Caption</button>
        <button class="genesis-quick-btn" @click="quickSend('Give me ONE marketing tip I can act on today to get closer to a KPPS sale.')">💡 Marketing Tip</button>
        <button class="genesis-quick-btn" @click="quickSend('Help me write a Final Offer breakdown for KPPS — price, value stack, bonuses, urgency, and CTA.')">🎯 Final Offer</button>
        <button class="genesis-quick-btn" @click="quickSend('What is the ONE thing I should focus on right now to hit $10K/month faster?')">📊 What to Focus On</button>
    </div>

    <!-- CONVERSATION LABEL -->
    <div class="genesis-conversation-label">Conversation</div>

    <!-- MESSAGES -->
    <div class="genesis-messages" x-ref="messageArea">
        <template x-if="messages.length === 0">
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:12px;opacity:0.75;padding:24px;">
                <p style="color:#c4b5fd;font-size:1.05rem;font-weight:700;margin:0;">Hey Monica. I'm Genesis — your AI chief of staff.</p>
                <p style="color:var(--text-subtle);font-size:0.85rem;margin:0;max-width:420px;line-height:1.6;">I know your businesses, your goals, and your avatars. Tap a quick prompt above or ask me anything — live scripts, emails, captions, marketing strategy, lead closing. Let's get you to $10K.</p>
            </div>
        </template>

        <template x-for="(msg, i) in messages" :key="i">
            <div class="genesis-msg" :class="msg.role === 'user' ? 'user' : 'ai'">
                <div class="genesis-avatar" :class="msg.role === 'user' ? 'user-avatar' : 'ai-avatar'"
                     x-text="msg.role === 'user' ? 'YOU' : 'GEN'"></div>
                <div class="genesis-bubble">
                    <div x-html="formatMessage(msg.content)"></div>
                    <div class="timestamp" x-text="formatTime(msg.timestamp)"></div>
                </div>
            </div>
        </template>

        <div x-show="loading" class="genesis-msg ai">
            <div class="genesis-avatar ai-avatar">GEN</div>
            <div class="genesis-bubble" style="background:var(--bg-card);border:1px solid var(--border-light);border-radius:14px 14px 14px 4px;">
                <div class="genesis-typing-dots"><span></span><span></span><span></span></div>
            </div>
        </div>
    </div>

    <!-- INPUT BAR -->
    <div class="genesis-input-bar">
        <form @submit.prevent="send()">
            <!-- Mic button -->
            <button type="button"
                    @click="toggleMic()"
                    :class="{ active: listening }"
                    class="genesis-mic-btn"
                    :title="listening ? 'Stop listening' : 'Speak to Genesis'">
                <svg x-show="!listening" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm-1 1.93V18H9v2h6v-2h-2v-2.07A7 7 0 0 0 19 11h-2a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93z"/>
                </svg>
                <svg x-show="listening" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <rect x="6" y="4" width="4" height="16" rx="1"/>
                    <rect x="14" y="4" width="4" height="16" rx="1"/>
                </svg>
            </button>
            <input type="text"
                   x-model="input"
                   :placeholder="listening ? 'Listening — speak now…' : 'Ask Genesis anything — or tap the mic'"
                   autocomplete="off"
                   :disabled="loading">
            <button type="submit" :disabled="loading || !input.trim()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </form>
    </div>
</div>

<script>
function genesisChat() {
    return {
        messages: [],
        input: '',
        loading: false,
        listening: false,
        _recognition: null,

        init() {
            const saved = localStorage.getItem('genesis-chat-history');
            if (saved) {
                try { this.messages = JSON.parse(saved); } catch(e) { this.messages = []; }
            }
        },

        saveHistory() {
            localStorage.setItem('genesis-chat-history', JSON.stringify(this.messages.slice(-60)));
        },

        scrollBottom() {
            this.$nextTick(() => {
                const area = this.$refs.messageArea;
                if (area) area.scrollTop = area.scrollHeight;
            });
        },

        clearHistory() {
            this.messages = [];
            localStorage.removeItem('genesis-chat-history');
        },

        quickSend(prompt) {
            this.input = prompt;
            this.send();
        },

        async send() {
            const message = this.input.trim();
            if (!message || this.loading) return;
            this.messages.push({ role:'user', content:message, timestamp:new Date().toISOString() });
            this.input = '';
            this.loading = true;
            this.saveHistory();
            this.scrollBottom();

            try {
                const history = this.messages.slice(-11, -1).map(m => ({ role:m.role, content:m.content }));
                const resp = await fetch('/jackie/api/chat', {
                    method:'POST',
                    headers:{ 'Content-Type':'application/json' },
                    body: JSON.stringify({ message, history }),
                });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                this.messages.push({ role:'assistant', content:data.response || "I couldn't process that.", timestamp:new Date().toISOString() });
            } catch(err) {
                this.messages.push({ role:'assistant', content:'Sorry, I hit an error. Check that your OPENROUTER_API_KEY is set in Railway.', timestamp:new Date().toISOString() });
            }

            this.loading = false;
            this.saveHistory();
            this.scrollBottom();
        },

        formatMessage(text) {
            if (!text) return '';
            return text
                .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
                .replace(/\*(.+?)\*/g,'<em>$1</em>')
                .replace(/^#{1,3} (.+)$/gm,'<strong>$1</strong>')
                .replace(/^[-•] (.+)$/gm,'<li>$1</li>')
                .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
                .replace(/\n\n+/g,'</p><p>')
                .replace(/\n/g,'<br>')
                .replace(/^(.+)$/,'<p>$1</p>');
        },

        formatTime(iso) {
            if (!iso) return '';
            return new Date(iso).toLocaleTimeString('en-US',{ hour:'numeric', minute:'2-digit' });
        },

        toggleMic() {
            if (this.listening) {
                this._recognition?.stop();
                this.listening = false;
                return;
            }
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                alert('Voice input requires Chrome or Edge. Try opening Genesis in Chrome.');
                return;
            }
            this._recognition = new SpeechRec();
            this._recognition.continuous     = true;
            this._recognition.interimResults  = false;
            this._recognition.lang            = 'en-US';
            this._recognition.onresult = (e) => {
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    if (e.results[i].isFinal) {
                        const transcript = e.results[i][0].transcript.trim();
                        this.input += (this.input ? ' ' : '') + transcript;
                    }
                }
            };
            this._recognition.onend = () => { this.listening = false; };
            this._recognition.onerror = (e) => {
                this.listening = false;
                if (e.error !== 'aborted') console.warn('Speech error:', e.error);
            };
            this._recognition.start();
            this.listening = true;
        },
    };
}
</script>
{% endblock %}
